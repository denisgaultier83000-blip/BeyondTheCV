services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # <-- AJOUT CRUCIAL : Expose le port 5432 du conteneur sur le port 5432 de votre PC (localhost)
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev # [FIX] Utilisation du Dockerfile de développement, plus léger et rapide.
    env_file:
      - .env  # Injecte les variables (OPENAI_API_KEY, etc.) dans le conteneur backend
    volumes:
      - ./backend:/app  # <--- AJOUT CRUCIAL : Synchronise ton code local avec le conteneur
    ports:
      - "8000:8000" # Expose le port de l'API backend sur votre machine locale

    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks: ["app-network"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s # Donne le temps à Uvicorn de démarrer, surtout avec --reload

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - .env  # Injecte aussi les variables pour le frontend (ex: VITE_API_URL)
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./front:/app          # Synchronise le code source
      - /app/node_modules     # [BEST PRACTICE] Empêche le node_modules local d'écraser celui du conteneur.
    depends_on:
      backend:
        condition: service_healthy # [FIX] Attend que le backend soit sain avant de démarrer le frontend
    networks: ["app-network"]

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
