server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Indispensable pour React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy same-origin pour l'API en staging et en local Docker
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache the entry HTML so deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Vite hashed assets can be cached forever because the filename changes when the content changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static media files (use versioned filenames if you need a longer cache).
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2)$ {
        expires 6M;
        add_header Cache-Control "public";
    }
}